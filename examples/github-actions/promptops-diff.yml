# PromptOps prompt-diff PR comment.
#
# Copy this file to .github/workflows/promptops-diff.yml in YOUR repository.
# It is shipped as an example rather than an active workflow here because the
# PromptOps repo has no .promptops/prompts/ of its own, so it would never fire.
#
# What it does: on a pull request that touches .promptops/prompts/**, work out
# which prompts changed, compute each one's semver impact, and post a single
# sticky comment. The comment is edited in place on subsequent pushes rather
# than a new one being appended, so a long-running PR does not accumulate a
# wall of stale bot noise.

name: PromptOps prompt diff

on:
  pull_request:
    paths:
      - ".promptops/prompts/**"

# Note on forks: GitHub grants a pull_request run from a FORKED repository a
# read-only GITHUB_TOKEN regardless of what this block says, so the comment
# step below will fail with a 403 on external contributors' PRs. That is
# deliberate on GitHub's part and this workflow does not try to defeat it.
#
# If you need comments on fork PRs, the only route is pull_request_target,
# which runs the workflow from the BASE branch with a writable token and
# access to secrets. Do not adopt it casually: checking out and executing the
# PR head under pull_request_target hands repository write access to anyone
# who opens a PR. If you go that way, keep the checkout at the base ref and
# treat every value coming from the PR as untrusted input.
permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: diffing a prompt against its committed version needs
          # more than the single squashed commit a shallow clone provides.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PromptOps
        # >=0.5.0: this workflow parses `promptops test diff --json`, and
        # neither --json nor the impact grading behind it exists earlier.
        run: pip install 'llmhq-promptops>=0.5.0'

      - name: Compute impact for each changed prompt
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            -- '.promptops/prompts/*.yaml' || true)

          if [ -z "$changed" ]; then
            echo "no prompt changes"
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## PromptOps prompt impact"
            echo
            echo "| Prompt | Impact | Changes |"
            echo "| --- | --- | --- |"
          } > comment.md

          worst=0
          for file in $changed; do
            id=$(basename "$file" .yaml)

            # --json keeps this parseable; --exit-code would abort the loop,
            # so severity is read from the payload instead.
            if ! out=$(promptops test diff "$id" \
                  --version1 "$BASE_SHA" --version2 "$HEAD_SHA" --json 2>&1); then
              echo "| \`$id\` | error | $(printf '%s' "$out" | tr '|\n' '  ' | head -c 200) |" >> comment.md
              continue
            fi

            # Both extractions stay on ONE line each. A multi-line `python -c`
            # string would dedent to column 0 and terminate this YAML block
            # scalar, making the whole workflow file unparseable.
            #
            # `details` is derived from prompt variable NAMES, which are
            # free-form YAML and may contain newlines and pipes. Both are
            # collapsed rather than escaped: a newline would break this
            # markdown table row, and worse, would let prompt content close
            # the $GITHUB_OUTPUT heredoc below.
            impact=$(printf '%s' "$out" | python -c 'import json,sys; print(json.load(sys.stdin)["impact"])')
            details=$(printf '%s' "$out" | python -c 'import json,sys; print("<br>".join(" ".join(c["detail"].split()).replace("|","\\|") for c in json.load(sys.stdin)["changes"]) or "prose only")')

            # POSIX tr rather than bash's ${impact^^}: this step would still
            # run if someone set `shell:` to sh or zsh, and a bashism would
            # fail there in a way that is annoying to debug from CI logs.
            impact_label=$(printf '%s' "$impact" | tr '[:lower:]' '[:upper:]')

            echo "| \`$id\` | **$impact_label** | $details |" >> comment.md

            case "$impact" in
              major) [ "$worst" -lt 3 ] && worst=3 ;;
              minor) [ "$worst" -lt 2 ] && worst=2 ;;
            esac
          done

          {
            echo
            if [ "$worst" -eq 3 ]; then
              echo "> **MAJOR**: the variable signature changed in a way that"
              echo "> breaks existing callers. Every caller must be updated."
            elif [ "$worst" -eq 2 ]; then
              echo "> **MINOR**: additive signature change. Existing callers"
              echo "> keep working."
            else
              echo "> Prose changes only. No caller-facing contract changed."
            fi
          } >> comment.md

          # Random delimiter, per GitHub's guidance for multi-line step
          # outputs. With a fixed one, any content containing that exact line
          # closes the heredoc early and everything after it is parsed as
          # further step outputs. Prompt content reaches this file, so that
          # was reachable rather than theoretical: a variable named
          # "x\nPROMPTOPS_EOF\nworst=0" would have set worst=0 and silenced
          # the MAJOR gate at the bottom of this workflow. The `details`
          # sanitising above closes the same hole from the other side; both
          # are kept, because neither should be the only thing standing
          # between prompt text and a forged step output.
          delim="PROMPTOPS_EOF_$(openssl rand -hex 16)"
          {
            echo "body<<$delim"
            cat comment.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          echo "worst=$worst" >> "$GITHUB_OUTPUT"

      - name: Post or update the sticky comment
        if: steps.impact.outputs.body != ''
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.impact.outputs.body }}
        with:
          script: |
            const marker = '<!-- promptops-impact -->';
            const body = `${marker}\n${process.env.BODY}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Optional gate. Uncomment to make a MAJOR prompt change block the PR.
      # Requires a human to acknowledge the break rather than merging past it.
      #
      # - name: Fail on MAJOR impact
      #   if: steps.impact.outputs.worst == '3'
      #   run: |
      #     echo "A prompt change breaks its caller contract. See the PR comment."
      #     exit 1

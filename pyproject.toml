[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmhq-promptops"
version = "0.4.0"
description = "Git blame for prompts: incident archaeology, git-native prompt versioning, and a no-SaaS production runtime for LLM workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "jision", email = "jisionpc@gmail.com" }
]
maintainers = [
  { name = "jision", email = "jisionpc@gmail.com" }
]
keywords = [
  "llm", "prompt", "versioning", "testing", "git", "automation",
  "cli", "sdk", "production", "workflow", "template", "jinja2",
  "incident-archaeology", "observability", "prompt-management",
  "blame", "deploy-tracking", "llmops"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Logging",
  "Typing :: Typed"
]
dependencies = [
  "click>=8.1.8",
  "Jinja2>=3.1.6",
  "PyYAML>=6.0.2",
  "typer>=0.15.2",
  "GitPython>=3.1.41"
]

[project.urls]
Homepage = "https://github.com/llmhq-hub/promptops"
Documentation = "https://github.com/llmhq-hub/promptops"
Repository = "https://github.com/llmhq-hub/promptops"
Issues = "https://github.com/llmhq-hub/promptops/issues"
Changelog = "https://github.com/llmhq-hub/promptops/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "black>=22.0.0",
  "flake8>=4.0.0",
  "mypy>=1.0.0",
  "pre-commit>=3.0.0"
]

[project.scripts]
promptops = "cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type-checkers (mypy, pyright)
# trust our type hints. The marker lives at src/llmhq_promptops/py.typed.
llmhq_promptops = ["py.typed"]
